<!-- 
  Squarespace Header Hider + Scroll to Top Arrow
  Add to Settings > Advanced > Code Injection > Footer
  Or add as a Code Block anywhere on the site
-->
<script>
(function() {
  'use strict';

  // Configuration
  const config = {
    hideHeaderSelectors: [
      '.header',
      '.header-nav',
      '.header-actions',
      '[data-section-id="header"]',
      '.top-bar',
      '.announcement-bar'
    ].join(', '),
    arrowPosition: { right: '24px', bottom: '24px' },
    arrowSize: 56,
    showAfterScroll: 300, // px
    scrollSpeed: 800 // ms
  };

  // CSS Styles
  const styles = `
    :root {
      --ssc-arrow-size: ${config.arrowSize}px;
      --ssc-arrow-bg: rgba(34, 197, 94, 0.9);
      --ssc-arrow-hover: rgba(34, 197, 94, 1);
      --ssc-arrow-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    /* Hide Squarespace Header */
    .squarespace-super {
      display: none !important;
    }
    
    /* Alternative header selectors for newer Squarespace templates */
    .header--mixed + .content-wrapper,
    .header--top,
    .header-split {
      margin-top: 0 !important;
    }

    /* Fullscreen app support */
    html, body {
      overflow-x: hidden;
    }

    body.has-sticky-header .header-section--menu,
    body.has-sticky-header .header-title {
      display: none !important;
    }

    /* Scroll Arrow Button */
    .ssc-scroll-arrow {
      position: fixed;
      z-index: 99999;
      width: var(--ssc-arrow-size);
      height: var(--ssc-arrow-size);
      border-radius: 50%;
      background: var(--ssc-arrow-bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--ssc-arrow-shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      right: ${config.arrowPosition.right};
      bottom: ${config.arrowPosition.bottom};
      -webkit-tap-highlight-color: transparent;
    }

    .ssc-scroll-arrow.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .ssc-scroll-arrow:hover {
      background: var(--ssc-arrow-hover);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.4);
    }

    .ssc-scroll-arrow:active {
      transform: translateY(-2px) scale(0.98);
    }

    .ssc-scroll-arrow svg {
      width: 24px;
      height: 24px;
      fill: white;
      transition: transform 0.2s ease;
    }

    .ssc-scroll-arrow:hover svg {
      transform: translateY(-2px);
    }

    /* Big screen / 130% zoom support */
    @media (min-width: 1200px) {
      .ssc-scroll-arrow {
        right: calc(${config.arrowPosition.right} + 2vw);
        bottom: calc(${config.arrowPosition.bottom} + 2vw);
      }
    }

    /* Handle 130%+ zoom gracefully */
    @media (min-resolution: 1.3dppx), (min--moz-device-pixel-ratio: 1.3), (-webkit-min-device-pixel-ratio: 1.3) {
      .ssc-scroll-arrow {
        --ssc-arrow-size: ${Math.round(config.arrowSize * 1.15)}px;
      }
    }

    /* Extra large displays */
    @media (min-width: 1920px) {
      .ssc-scroll-arrow {
        --ssc-arrow-size: ${Math.round(config.arrowSize * 1.3)}px;
        right: 40px;
        bottom: 40px;
      }
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .ssc-scroll-arrow {
        --ssc-arrow-size: ${Math.round(config.arrowSize * 0.85)}px;
        right: 16px;
        bottom: 16px;
      }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      .ssc-scroll-arrow {
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
    }
  `;

  // Inject styles
  function injectStyles() {
    if (document.getElementById('ssc-styles')) return;
    const styleEl = document.createElement('style');
    styleEl.id = 'ssc-styles';
    styleEl.textContent = styles;
    (document.head || document.documentElement).appendChild(styleEl);
  }

  // Hide Squarespace header
  function hideHeader() {
    const selectors = [
      '.header',
      '.header-nav',
      '.header-actions', 
      '.header-section--menu',
      '.header-title',
      '.top-bar',
      '.announcement-bar',
      '.header--wrapper',
      '.header-layout--center',
      '.sqs-announcement-bar'
    ];
    
    selectors.forEach(selector => {
      document.querySelectorAll(selector).forEach(el => {
        el.style.display = 'none';
      });
    });

    // Also try to find header by common structure
    const headerEl = document.querySelector('header');
    if (headerEl && headerEl.classList.contains('header')) {
      headerEl.style.display = 'none';
    }
  }

  // Create scroll arrow
  function createArrow() {
    if (document.querySelector('.ssc-scroll-arrow')) return;

    const arrow = document.createElement('button');
    arrow.className = 'ssc-scroll-arrow';
    arrow.setAttribute('aria-label', 'Scroll to top');
    arrow.innerHTML = `
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 4l-8 8h5v8h6v-8h5z"/>
      </svg>
    `;
    
    arrow.addEventListener('click', scrollToTop);
    document.body.appendChild(arrow);
    
    return arrow;
  }

  // Scroll to top with easing
  function scrollToTop() {
    const start = window.pageYOffset;
    const startTime = performance.now();
    const duration = config.scrollSpeed;

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function animate(currentTime) {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(progress);
      
      window.scrollTo(0, start * (1 - eased));
      
      if (progress < 1) {
        requestAnimationFrame(animate);
      }
    }

    requestAnimationFrame(animate);
  }

  // Handle scroll events
  function handleScroll() {
    const arrow = document.querySelector('.ssc-scroll-arrow');
    if (!arrow) return;

    const scrollY = window.pageYOffset || document.documentElement.scrollTop;
    
    if (scrollY > config.showAfterScroll) {
      arrow.classList.add('visible');
    } else {
      arrow.classList.remove('visible');
    }
  }

  // Initialize
  function init() {
    injectStyles();
    hideHeader();
    createArrow();
    
    // Add scroll listener with passive option for performance
    window.addEventListener('scroll', handleScroll, { passive: true });
    
    // Re-run header hide after DOM changes (for Squarespace AJAX)
    const observer = new MutationObserver(() => {
      hideHeader();
    });
    
    observer.observe(document.body, { 
      childList: true, 
      subtree: true 
    });
    
    // Handle page navigation
    window.addEventListener('popstate', () => {
      setTimeout(hideHeader, 100);
    });
  }

  // Run when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Also run after Squarespace animations
  window.addEventListener('load', () => {
    setTimeout(hideHeader, 500);
  });

})();
</script>

<style>
/* Additional CSS for Squarespace injection */
.ssc-scroll-arrow {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
</style>
